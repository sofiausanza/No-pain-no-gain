name: Recordatorio de agua

on:
  schedule:
    # 9, 12, 15, 18 y 21 hs de Argentina (UTC-3)
    - cron: "0 12,15,18,21,0 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Chequear hidratación y avisar si hace falta
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/api/push/check-hidratacion" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
